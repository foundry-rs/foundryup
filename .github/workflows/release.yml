name: Release

permissions: {}

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    permissions:
      id-token: write
      contents: read
      attestations: write
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: depot-ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: amd64
          - os: depot-ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: arm64
          - os: depot-ubuntu-22.04
            target: x86_64-unknown-linux-musl
            platform: alpine
            arch: amd64
          - os: depot-ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            platform: alpine
            arch: arm64
          - os: macos-14
            target: x86_64-apple-darwin
            platform: darwin
            arch: amd64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin
            arch: arm64
          - os: depot-windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32
            arch: amd64
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@117919c943b804057be733b0c4034c5542e58959
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-musl' || matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Build
        run: cargo build --locked --profile dist --target ${{ matrix.target }}

      - name: Prepare artifact
        id: artifacts
        shell: bash
        run: |
          if [[ "${{ matrix.platform }}" == "win32" ]]; then
            exe=".exe"
          fi
          bin_name="foundryup_${{ matrix.platform }}_${{ matrix.arch }}${exe}"
          cp target/${{ matrix.target }}/dist/foundryup${exe} "$bin_name"
          printf 'bin_name=%s\n' "$bin_name" >> "$GITHUB_OUTPUT"
          printf 'attestation_file=%s\n' "foundryup_${{ matrix.platform }}_${{ matrix.arch }}.attestation.txt" >> "$GITHUB_OUTPUT"

      - name: Generate attestation
        id: attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.artifacts.outputs.bin_name }}

      - name: Record attestation URL
        env:
          ATTESTATION_URL: ${{ steps.attestation.outputs.attestation-url }}
          ATTESTATION_FILE: ${{ steps.artifacts.outputs.attestation_file }}
        shell: bash
        run: printf '%s\n' "$ATTESTATION_URL" > "$ATTESTATION_FILE"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: foundryup_${{ matrix.platform }}_${{ matrix.arch }}
          path: |
            ${{ steps.artifacts.outputs.bin_name }}
            ${{ steps.artifacts.outputs.attestation_file }}
          if-no-files-found: error

  release:
    permissions:
      id-token: write
      contents: write
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@117919c943b804057be733b0c4034c5542e58959
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: artifacts/*
          generate_release_notes: true
